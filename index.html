<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>macOS Web Desktop</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  color:#111;
}
body{
  background:#071d3d;
  user-select:none;
}
button,input,textarea{font:inherit}
button{cursor:pointer}

:root{
  --accent:#0a84ff;
  --glass:rgba(255,255,255,.68);
  --glass2:rgba(255,255,255,.82);
  --border:rgba(255,255,255,.32);
  --shadow:0 25px 70px rgba(0,0,0,.30);
}

body.dark{
  --glass:rgba(30,30,35,.72);
  --glass2:rgba(40,40,45,.92);
  --border:rgba(255,255,255,.13);
  color:#eee;
}

#desktop{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 18% 30%,rgba(30,130,255,.55),transparent 28%),
    radial-gradient(circle at 80% 25%,rgba(160,70,255,.45),transparent 28%),
    radial-gradient(circle at 55% 85%,rgba(0,220,190,.25),transparent 30%),
    linear-gradient(135deg,#07142e,#153f70 45%,#321866);
}

body.dark #desktop{
  background:
    radial-gradient(circle at 20% 25%,rgba(30,100,190,.35),transparent 30%),
    radial-gradient(circle at 80% 25%,rgba(100,40,170,.3),transparent 30%),
    linear-gradient(135deg,#02050b,#0b1730,#170b25);
}

/* wallpaper decoration */
#desktop:before,#desktop:after{
  content:"";
  position:absolute;
  width:55vw;
  height:55vw;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.08);
  filter:blur(1px);
  pointer-events:none;
}
#desktop:before{left:-20vw;bottom:-30vw}
#desktop:after{right:-20vw;top:-30vw}

/* MENU BAR */
#menuBar{
  position:absolute;
  z-index:10000;
  left:0;
  right:0;
  top:0;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  background:rgba(245,245,245,.55);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,.18);
  font-size:13px;
}
body.dark #menuBar{background:rgba(25,25,28,.65)}

.menu-left,.menu-right{
  display:flex;
  align-items:center;
  gap:5px;
}
.menu-item{
  padding:3px 8px;
  border-radius:6px;
  white-space:nowrap;
}
.menu-item:hover{background:rgba(255,255,255,.22)}
.apple{
  font-size:17px;
  line-height:1;
  padding:0 8px;
}
.menu-app{font-weight:650}

.status{
  display:flex;
  align-items:center;
  gap:11px;
  padding:3px 6px;
  border-radius:7px;
}
.status:hover{background:rgba(255,255,255,.2)}
#clock{min-width:125px;text-align:right}

/* DESKTOP ICONS */
#desktopIcons{
  position:absolute;
  top:48px;
  right:20px;
  width:100px;
  display:flex;
  flex-direction:column;
  gap:20px;
  z-index:2;
}
.desktop-icon{
  width:88px;
  padding:7px 3px;
  border-radius:10px;
  text-align:center;
  color:white;
  text-shadow:0 2px 5px rgba(0,0,0,.7);
}
.desktop-icon:hover{background:rgba(255,255,255,.14)}
.desktop-icon .big{font-size:42px;display:block;margin-bottom:3px}
.desktop-icon span{font-size:12px}

/* WINDOWS */
#windows{
  position:absolute;
  inset:30px 0 0;
  z-index:100;
  pointer-events:none;
}
.window{
  position:absolute;
  min-width:340px;
  min-height:220px;
  width:720px;
  height:500px;
  max-width:calc(100vw - 20px);
  max-height:calc(100vh - 80px);
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--glass2);
  box-shadow:var(--shadow);
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  pointer-events:auto;
  resize:both;
  animation:windowIn .18s ease;
}
@keyframes windowIn{
  from{opacity:0;transform:scale(.94) translateY(12px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.window.active{
  box-shadow:0 30px 90px rgba(0,0,0,.42);
}
.window.maximized{
  left:8px!important;
  top:4px!important;
  width:calc(100vw - 16px)!important;
  height:calc(100vh - 76px)!important;
  max-width:none;
  max-height:none;
  resize:none;
}
.window.minimized{
  display:none;
}

.titlebar{
  height:46px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 13px;
  background:rgba(255,255,255,.24);
  border-bottom:1px solid var(--border);
  cursor:grab;
}
body.dark .titlebar{background:rgba(255,255,255,.04)}
.titlebar:active{cursor:grabbing}

.traffic{
  display:flex;
  gap:7px;
}
.traffic button{
  border:0;
  width:13px;
  height:13px;
  border-radius:50%;
  padding:0;
  position:relative;
}
.close{background:#ff5f57}
.min{background:#febc2e}
.max{background:#28c840}
.traffic button:hover:after{
  content:"";
  position:absolute;
  inset:3px;
  border-radius:50%;
  background:rgba(0,0,0,.25);
}
.window-title{
  flex:1;
  text-align:center;
  font-size:13px;
  font-weight:600;
  margin-right:58px;
}
.window-body{
  height:calc(100% - 46px);
  overflow:auto;
}

/* DOCK */
#dockWrap{
  position:absolute;
  z-index:9000;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  padding:6px;
  border-radius:21px;
  background:rgba(245,245,245,.48);
  border:1px solid rgba(255,255,255,.25);
  backdrop-filter:blur(25px) saturate(180%);
  -webkit-backdrop-filter:blur(25px) saturate(180%);
  box-shadow:0 12px 40px rgba(0,0,0,.28);
}
body.dark #dockWrap{background:rgba(35,35,40,.58)}

#dock{
  display:flex;
  align-items:flex-end;
  gap:7px;
}
.dock-item{
  width:52px;
  height:52px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  position:relative;
  transition:.16s cubic-bezier(.2,.8,.2,1);
  transform-origin:bottom center;
  filter:drop-shadow(0 4px 5px rgba(0,0,0,.25));
}
.dock-item:hover{
  transform:translateY(-17px) scale(1.38);
  margin:0 10px;
}
.dock-item:active{transform:translateY(-10px) scale(1.25)}
.dock-item[data-tip]:after{
  content:attr(data-tip);
  position:absolute;
  top:-34px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(20,20,20,.85);
  color:white;
  font-size:11px;
  padding:5px 8px;
  border-radius:6px;
  opacity:0;
  pointer-events:none;
  white-space:nowrap;
  transition:.15s;
}
.dock-item:hover:after{opacity:1}
.active-dot{
  position:absolute;
  bottom:-3px;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#333;
}
body.dark .active-dot{background:white}

.divider{
  width:1px;
  height:44px;
  background:rgba(255,255,255,.4);
  margin:0 3px;
}

/* APP COMMON */
.app{
  height:100%;
  display:flex;
}
.sidebar{
  width:190px;
  padding:13px 9px;
  background:rgba(245,245,245,.28);
  border-right:1px solid var(--border);
  overflow:auto;
}
body.dark .sidebar{background:rgba(0,0,0,.12)}
.sidebar h4{
  font-size:11px;
  text-transform:uppercase;
  opacity:.55;
  padding:7px 10px;
  margin:0;
}
.side-btn{
  width:100%;
  border:0;
  background:transparent;
  color:inherit;
  padding:8px 10px;
  border-radius:7px;
  text-align:left;
  display:flex;
  gap:8px;
  align-items:center;
}
.side-btn:hover,.side-btn.active{background:rgba(100,100,100,.13)}
.side-btn.active{color:var(--accent);font-weight:600}

.content{
  flex:1;
  overflow:auto;
  padding:18px;
}
.toolbar{
  height:42px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  border-bottom:1px solid var(--border);
}
.toolbtn{
  border:0;
  background:rgba(120,120,120,.12);
  color:inherit;
  border-radius:7px;
  padding:6px 10px;
}
.toolbtn:hover{background:rgba(120,120,120,.2)}
.search{
  margin-left:auto;
  width:190px;
  border:1px solid rgba(100,100,100,.2);
  background:rgba(255,255,255,.3);
  color:inherit;
  border-radius:8px;
  padding:7px 10px;
  outline:none;
}
body.dark .search{background:rgba(255,255,255,.08)}

.card{
  border-radius:14px;
  background:rgba(255,255,255,.35);
  border:1px solid var(--border);
  padding:16px;
}
body.dark .card{background:rgba(255,255,255,.05)}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(125px,1fr));
  gap:14px;
}
.tile{
  border:1px solid var(--border);
  border-radius:13px;
  background:rgba(255,255,255,.25);
  padding:16px;
  min-height:105px;
  transition:.15s;
}
.tile:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.4);
}
body.dark .tile{background:rgba(255,255,255,.04)}
.tile-icon{font-size:38px;margin-bottom:8px}
.tile-name{font-weight:600;font-size:13px}
.muted{opacity:.58}
h1,h2,h3,p{margin-top:0}

/* FINDER */
.filegrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(125px,1fr));
  gap:12px;
  padding:18px;
}
.file{
  padding:13px;
  border-radius:10px;
  text-align:center;
}
.file:hover{background:rgba(80,120,255,.13)}
.file .fi{font-size:48px}
.file .fn{font-size:12px;margin-top:7px;word-break:break-word}

/* LAUNCHPAD */
#launchpad{
  position:absolute;
  inset:30px 0 0;
  z-index:8000;
  display:none;
  background:rgba(10,20,45,.68);
  backdrop-filter:blur(35px);
  -webkit-backdrop-filter:blur(35px);
  padding:45px 8vw;
  overflow:auto;
}
#launchpad.show{display:block}
.launch-search{
  width:300px;
  max-width:90%;
  display:block;
  margin:0 auto 35px;
  padding:12px 18px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;
  outline:none;
  color:white;
  background:rgba(255,255,255,.13);
  text-align:center;
}
.launch-grid{
  max-width:950px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(95px,1fr));
  gap:30px;
}
.launch-app{
  text-align:center;
  color:white;
  border-radius:12px;
  padding:8px;
}
.launch-app:hover{background:rgba(255,255,255,.13)}
.launch-icon{
  font-size:51px;
  margin-bottom:7px;
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.25));
}
.launch-name{font-size:12px}

/* CONTROL CENTER */
#controlCenter{
  position:absolute;
  right:12px;
  top:36px;
  z-index:11000;
  width:340px;
  padding:12px;
  border-radius:20px;
  background:var(--glass2);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  backdrop-filter:blur(30px);
  display:none;
}
#controlCenter.show{display:block}
.cc-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.cc-card{
  border:0;
  border-radius:14px;
  padding:14px;
  text-align:left;
  background:rgba(100,100,100,.12);
  color:inherit;
}
.cc-card.on{background:var(--accent);color:white}
.cc-card b{display:block;font-size:13px}
.cc-card span{font-size:11px;opacity:.75}
.slider{
  width:100%;
  accent-color:var(--accent);
}

/* NOTES */
.notes-layout{display:flex;height:100%}
.notes-list{
  width:210px;
  border-right:1px solid var(--border);
  overflow:auto;
}
.note-row{
  padding:12px;
  border-bottom:1px solid var(--border);
}
.note-row.active{background:rgba(100,100,100,.12)}
.note-row b{display:block}
.note-editor{
  flex:1;
  padding:20px;
}
.note-title{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:inherit;
  font-size:25px;
  font-weight:700;
}
.note-text{
  width:100%;
  height:calc(100% - 50px);
  margin-top:15px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:inherit;
}

/* CALENDAR */
.calendar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 20px;
}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  padding:0 16px 16px;
  gap:4px;
}
.cal-day{
  min-height:62px;
  padding:7px;
  border-radius:8px;
  background:rgba(120,120,120,.06);
}
.cal-day.today{outline:2px solid var(--accent)}
.cal-head{
  text-align:center;
  opacity:.55;
  padding:6px;
  font-size:12px;
}

/* CALCULATOR */
.calc{
  max-width:360px;
  margin:25px auto;
}
.calc-display{
  width:100%;
  height:90px;
  border:0;
  background:rgba(0,0,0,.12);
  color:inherit;
  border-radius:16px;
  text-align:right;
  padding:15px;
  font-size:42px;
  margin-bottom:10px;
}
.calc-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.calc-btn{
  height:65px;
  border:0;
  border-radius:14px;
  background:rgba(120,120,120,.15);
  color:inherit;
  font-size:20px;
}
.calc-btn:hover{background:rgba(120,120,120,.25)}
.calc-btn.op{background:var(--accent);color:white}

/* TERMINAL */
.terminal{
  height:100%;
  background:#111;
  color:#e9e9e9;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  padding:15px;
  overflow:auto;
}
.term-output{white-space:pre-wrap;line-height:1.45}
.term-line{display:flex;gap:8px}
.term-input{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font:inherit;
}

/* BROWSER */
.browser-bar{
  display:flex;
  gap:8px;
  padding:9px;
  background:rgba(120,120,120,.09);
  border-bottom:1px solid var(--border);
}
.browser-input{
  flex:1;
  border:0;
  outline:0;
  border-radius:9px;
  padding:9px 12px;
  background:rgba(120,120,120,.12);
  color:inherit;
}
.browser-page{
  min-height:100%;
  padding:40px;
}
.browser-home{
  max-width:650px;
  margin:40px auto;
  text-align:center;
}
.browser-logo{font-size:75px}
.browser-home input{
  width:100%;
  padding:15px 20px;
  border-radius:25px;
  border:1px solid var(--border);
  outline:none;
  background:rgba(120,120,120,.12);
  color:inherit;
}

/* MESSAGES */
.chat{
  display:flex;
  height:100%;
}
.contacts{
  width:190px;
  border-right:1px solid var(--border);
  overflow:auto;
}
.contact{
  padding:12px;
  display:flex;
  gap:9px;
  align-items:center;
}
.contact:hover,.contact.active{background:rgba(100,100,100,.13)}
.avatar{
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:linear-gradient(135deg,#0a84ff,#8e44ff);
  color:white;
}
.conversation{
  flex:1;
  display:flex;
  flex-direction:column;
}
.chat-messages{
  flex:1;
  overflow:auto;
  padding:20px;
}
.bubble{
  max-width:70%;
  width:max-content;
  padding:9px 13px;
  border-radius:17px;
  margin:6px 0;
  background:rgba(120,120,120,.15);
}
.bubble.me{
  margin-left:auto;
  background:var(--accent);
  color:white;
}
.chat-compose{
  display:flex;
  gap:7px;
  padding:10px;
  border-top:1px solid var(--border);
}
.chat-compose input{
  flex:1;
  border:0;
  outline:0;
  border-radius:20px;
  padding:10px 14px;
  background:rgba(120,120,120,.12);
  color:inherit;
}

/* SETTINGS */
.settings{
  display:flex;
  height:100%;
}
.settings-side{
  width:210px;
  padding:12px;
  border-right:1px solid var(--border);
}
.settings-page{
  flex:1;
  padding:25px;
  overflow:auto;
}
.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 0;
  border-bottom:1px solid var(--border);
}
.toggle{
  width:45px;
  height:25px;
  border-radius:20px;
  border:0;
  background:#888;
  padding:3px;
}
.toggle i{
  display:block;
  width:19px;
  height:19px;
  border-radius:50%;
  background:white;
  transition:.2s;
}
.toggle.on{background:var(--accent)}
.toggle.on i{transform:translateX(20px)}

.color-row{display:flex;gap:10px}
.color{
  width:28px;
  height:28px;
  border-radius:50%;
  border:2px solid white;
  box-shadow:0 0 0 1px #999;
}

/* PHOTOS */
.photo{
  aspect-ratio:1;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  cursor:pointer;
  background:linear-gradient(135deg,#5d9cff,#c77dff);
  box-shadow:0 8px 20px rgba(0,0,0,.13);
}
.photo:nth-child(2n){background:linear-gradient(135deg,#00c6ff,#0072ff)}
.photo:nth-child(3n){background:linear-gradient(135deg,#ff758c,#ff7eb3)}
.photo:nth-child(4n){background:linear-gradient(135deg,#43e97b,#38f9d7)}

/* MAIL */
.mail-list{padding:10px}
.mail{
  padding:14px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}
.mail:hover{background:rgba(100,100,100,.1)}
.mail.unread{font-weight:700}
.mail-subject{font-size:14px}
.mail-preview{font-size:12px;opacity:.65;margin-top:4px}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  z-index:20000;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.35);
}
.modal.show{display:flex}
.modal-box{
  width:400px;
  max-width:90vw;
  border-radius:17px;
  background:var(--glass2);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  padding:20px;
  backdrop-filter:blur(30px);
}
.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:15px;
}
.primary{
  border:0;
  background:var(--accent);
  color:white;
  border-radius:8px;
  padding:8px 14px;
}
.secondary{
  border:0;
  background:rgba(100,100,100,.14);
  color:inherit;
  border-radius:8px;
  padding:8px 14px;
}

/* TOAST */
#toastArea{
  position:absolute;
  right:18px;
  bottom:95px;
  z-index:30000;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.toast{
  background:rgba(30,30,30,.88);
  color:white;
  padding:11px 15px;
  border-radius:11px;
  box-shadow:0 8px 25px rgba(0,0,0,.3);
  animation:toastIn .2s ease;
}
@keyframes toastIn{
  from{opacity:0;transform:translateX(20px)}
  to{opacity:1;transform:translateX(0)}
}

/* CONTEXT MENU */
#contextMenu{
  position:absolute;
  z-index:25000;
  width:210px;
  padding:5px;
  border-radius:11px;
  background:var(--glass2);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  backdrop-filter:blur(25px);
  display:none;
}
.context-item{
  padding:8px 10px;
  border-radius:7px;
  font-size:13px;
}
.context-item:hover{background:var(--accent);color:white}

/* MOBILE */
@media(max-width:700px){
  #menuBar{height:32px}
  .menu-left .hide-mobile{display:none}
  .menu-right .hide-mobile{display:none}
  #desktopIcons{right:7px;top:45px}
  #dockWrap{
    bottom:5px;

<script>
/* =========================================================
   STATE
========================================================= */

const state = {
  z:100,
  windows:{},
  dark:localStorage.getItem("macDark")==="1",
  accent:localStorage.getItem("macAccent") || "#0a84ff",
  wifi:true,
  bluetooth:true,
  focus:false,
  brightness:100,
  volume:70,
  notes:JSON.parse(localStorage.getItem("macNotes") || "null") || [
    {id:1,title:"Welcome",text:"Welcome to your web Mac!\\n\\nEverything here is running from one HTML file."},
    {id:2,title:"Ideas",text:"Build something awesome."}
  ],
  selectedNote:1,
  chat:"Alex",
  chats:{
    Alex:["Yo! Welcome to the new Mac.","This desktop is actually interactive 😎"],
    Sam:["Hey!","Check out the new apps!"],
    Jordan:["What's up?","Try the Terminal app."]
  }
};

document.documentElement.style.setProperty("--accent",state.accent);
if(state.dark) document.body.classList.add("dark");

/* =========================================================
   APP DEFINITIONS
========================================================= */

const apps = {
  finder:{name:"Finder",icon:"📁"},
  launchpad:{name:"Launchpad",icon:"🚀"},
  safari:{name:"Safari",icon:"🧭"},
  messages:{name:"Messages",icon:"💬"},
  mail:{name:"Mail",icon:"✉️"},
  photos:{name:"Photos",icon:"🌈"},
  calendar:{name:"Calendar",icon:"📅"},
  notes:{name:"Notes",icon:"📝"},
  calculator:{name:"Calculator",icon:"🧮"},
  terminal:{name:"Terminal",icon:"⌘"},
  settings:{name:"System Settings",icon:"⚙️"},
  appstore:{name:"App Store",icon:"🛍️"},
  music:{name:"Music",icon:"🎵"},
  weather:{name:"Weather",icon:"☀️"},
  maps:{name:"Maps",icon:"🗺️"},
  clockapp:{name:"Clock",icon:"⏰"},
  contacts:{name:"Contacts",icon:"👤"},
  reminders:{name:"Reminders",icon:"✓"},
  news:{name:"News",icon:"📰"},
  trash:{name:"Trash",icon:"🗑️"}
};

const dockApps=[
  "finder","launchpad","safari","messages","mail","photos",
  "calendar","notes","calculator","terminal","settings"
];

/* =========================================================
   DOCK
========================================================= */

function buildDock(){
  const dock=document.getElementById("dock");
  dock.innerHTML="";

  dockApps.forEach(id=>{
    const a=apps[id];
    const el=document.createElement("div");
    el.className="dock-item";
    el.dataset.tip=a.name;
    el.innerHTML=a.icon;
    el.onclick=()=>openApp(id);
    dock.appendChild(el);
  });

  const divider=document.createElement("div");
  divider.className="divider";
  dock.appendChild(divider);

  const trash=document.createElement("div");
  trash.className="dock-item";
  trash.dataset.tip="Trash";
  trash.innerHTML="🗑️";
  trash.onclick=()=>openApp("trash");
  dock.appendChild(trash);
}
buildDock();

/* =========================================================
   CLOCK
========================================================= */

function updateClock(){
  const d=new Date();
  document.getElementById("clock").textContent=d.toLocaleString([],{
    weekday:"short",
    month:"short",
    day:"numeric",
    hour:"numeric",
    minute:"2-digit"
  });
}
setInterval(updateClock,1000);
updateClock();

/* =========================================================
   TOAST
========================================================= */

function showToast(message){
  const el=document.createElement("div");
  el.className="toast";
  el.textContent=message;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

/* =========================================================
   WINDOW MANAGER
========================================================= */

function openApp(id){
  if(id==="launchpad"){
    toggleLaunchpad(true);
    return;
  }

  if(state.windows[id]){
    const w=state.windows[id];
    w.classList.remove("minimized");
    focusWindow(w);
    return;
  }

  const def=apps[id] || {name:id,icon:"📦"};

  const w=document.createElement("div");
  w.className="window active";
  w.dataset.app=id;

  const existing=Object.keys(state.windows).length;
  w.style.left=Math.min(90+existing*28,window.innerWidth-390)+"px";
  w.style.top=Math.min(65+existing*24,window.innerHeight-350)+"px";
  w.style.zIndex=++state.z;

  w.innerHTML=`
    <div class="titlebar">
      <div class="traffic">
        <button class="close" title="Close"></button>
        <button class="min" title="Minimize"></button>
        <button class="max" title="Maximize"></button>
      </div>
      <div class="window-title">${def.icon} &nbsp; ${def.name}</div>
    </div>
    <div class="window-body" id="body-${id}"></div>
  `;

  document.getElementById("windows").appendChild(w);
  state.windows[id]=w;

  w.querySelector(".close").onclick=e=>{
    e.stopPropagation();
    closeWindow(id);
  };
  w.querySelector(".min").onclick=e=>{
    e.stopPropagation();
    w.classList.add("minimized");
  };
  w.querySelector(".max").onclick=e=>{
    e.stopPropagation();
    w.classList.toggle("maximized");
  };

  w.addEventListener("pointerdown",()=>focusWindow(w));
  makeDraggable(w);

  renderApp(id,w.querySelector(".window-body"));
  focusWindow(w);
  document.getElementById("activeMenu").textContent=def.name;
}

function closeWindow(id){
  if(state.windows[id]){
    state.windows[id].remove();
    delete state.windows[id];
  }
}

function focusWindow(w){
  document.querySelectorAll(".window").forEach(x=>x.classList.remove("active"));
  w.classList.add("active");
  w.style.zIndex=++state.z;
  const id=w.dataset.app;
  if(apps[id]) document.getElementById("activeMenu").textContent=apps[id].name;
}

function makeDraggable(w){
  const bar=w.querySelector(".titlebar");
  let dragging=false,startX=0,startY=0,startL=0,startT=0;

  bar.addEventListener("pointerdown",e=>{
    if(e.target.closest("button"))return;
    if(w.classList.contains("maximized"))return;

    dragging=true;
    startX=e.clientX;
    startY=e.clientY;
    startL=parseFloat(w.style.left)||0;
    startT=parseFloat(w.style.top)||0;
    bar.setPointerCapture(e.pointerId);
  });

  bar.addEventListener("pointermove",e=>{
    if(!dragging)return;
    w.style.left=(startL+e.clientX-startX)+"px";
    w.style.top=Math.max(4,startT+e.clientY-startY)+"px";
  });

  bar.addEventListener("pointerup",()=>dragging=false);
  bar.addEventListener("dblclick",e=>{
    if(!e.target.closest("button"))w.classList.toggle("maximized");
  });
}

/* =========================================================
   APP RENDERER
========================================================= */

function renderApp(id,body){

  if(id==="finder") renderFinder(body);
  else if(id==="safari") renderSafari(body);
  else if(id==="messages") renderMessages(body);
  else if(id==="mail") renderMail(body);
  else if(id==="photos") renderPhotos(body);
  else if(id==="calendar") renderCalendar(body);
  else if(id==="notes") renderNotes(body);
  else if(id==="calculator") renderCalculator(body);
  else if(id==="terminal") renderTerminal(body);
  else if(id==="settings") renderSettings(body);
  else if(id==="appstore") renderAppStore(body);
  else if(id==="music") renderMusic(body);
  else if(id==="weather") renderWeather(body);
  else if(id==="maps") renderMaps(body);
  else if(id==="clockapp") renderClock(body);
  else if(id==="contacts") renderContacts(body);
  else if(id==="reminders") renderReminders(body);
  else if(id==="news") renderNews(body);
  else if(id==="trash") renderTrash(body);
  else renderGeneric(body,id);
}

/* =========================================================
   FINDER
========================================================= */

const finderItems=[
  ["Applications","📦","folder"],
  ["Desktop","🖥️","folder"],
  ["Documents","📄","folder"],
  ["Downloads","⬇️","folder"],
  ["Movies","🎬","folder"],
  ["Music","🎵","folder"],
  ["Pictures","🖼️","folder"],
  ["iCloud Drive","☁️","folder"],
  ["Read Me.txt","📃","file"],
  ["Project.html","🌐","file"]
];

function renderFinder(body){
  body.innerHTML=`
    <div class="app">
      <div class="sidebar">
        <h4>Favorites</h4>
        <button class="side-btn active">⭐ Recents</button>
        <button class="side-btn">📱 AirDrop</button>
        <button class="side-btn">☁️ iCloud Drive</button>
        <button class="side-btn">🖥️ Desktop</button>
        <button class="side-btn">📄 Documents</button>
        <button class="side-btn">⬇️ Downloads</button>
        <h4>Locations</h4>
        <button class="side-btn">💻 Macintosh HD</button>
        <button class="side-btn">🌐 Network</button>
      </div>
      <div style="flex:1;overflow:auto">
        <div class="toolbar">
          <button class="toolbtn">‹</button>
          <button class="toolbtn">›</button>
          <button class="toolbtn" onclick="newFolder()">＋</button>
          <input class="search" id="finderSearch" placeholder="Search">
        </div>
        <div class="filegrid" id="finderGrid"></div>
      </div>
    </div>
  `;

  const grid=body.querySelector("#finderGrid");

  function draw(filter=""){
    grid.innerHTML="";
    finderItems
      .filter(x=>x[0].toLowerCase().includes(filter.toLowerCase()))
      .forEach(item=>{
        const el=document.createElement("div");
        el.className="file";
        el.innerHTML=`<div class="fi">${item[1]}</div><div class="fn">${item[0]}</div>`;
        el.ondblclick=()=>{
          if(item[2]==="folder"){
            showToast("Opened "+item[0]);
          }else{
            showModal(`
              <h2>${item[0]}</h2>
              <p class="muted">This is a file inside your web desktop.</p>
              <div class="modal-actions">
                <button class="primary" onclick="closeModal()">Done</button>
              </div>
            `);
          }
        };
        grid.appendChild(el);
      });
  }

  draw();
  body.querySelector("#finderSearch").oninput=e=>draw(e.target.value);
}

function newFolder(){
  showModal(`
    <h2>New Folder</h2>
    <input id="newFolderName" class="search" style="width:100%;margin:10px 0" value="untitled folder">
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="createFolder()">Create</button>
    </div>
  `);
}
function createFolder(){
  const name=document.getElementById("newFolderName").value.trim()||"untitled folder";
  finderItems.push([name,"📁","folder"]);
  closeModal();
  if(state.windows.finder)renderFinder(state.windows.finder.querySelector(".window-body"));
  showToast("Created "+name);
}

/* =========================================================
   SAFARI
========================================================= */

function renderSafari(body){
  body.innerHTML=`
    <div style="height:100%;display:flex;flex-direction:column">
      <div class="browser-bar">
        <button class="toolbtn" onclick="browserHome()">‹</button>
        <button class="toolbtn">›</button>
        <button class="toolbtn">↻</button>
        <input class="browser-input" id="browserURL" placeholder="Search or enter website address">
        <button class="toolbtn" onclick="goBrowser()">Go</button>
      </div>
      <div class="browser-page" id="browserPage">
        <div class="browser-home">
          <div class="browser-logo">🧭</div>
          <h1>Safari</h1>
          <p class="muted">A fast web browser inside your web desktop.</p>
          <input id="homeSearch" placeholder="Search the web">
          <div style="margin-top:15px">
            <button class="primary" onclick="searchBrowser()">Search</button>
            <button class="secondary" onclick="openExternal('https://www.google.com')">Open Google</button>
          </div>
        </div>
      </div>
    </div>
  `;

  body.querySelector("#browserURL").addEventListener("keydown",e=>{
    if(e.key==="Enter")goBrowser();
  });
  body.querySelector("#homeSearch").addEventListener("keydown",e=>{
    if(e.key==="Enter")searchBrowser();
  });
}

function browserHome(){
  const w=state.windows.safari;
  if(w)renderSafari(w.querySelector(".window-body"));
}

function goBrowser(){
  const input=document.getElementById("browserURL");
  if(!input)return;
  let value=input.value.trim();
  if(!value)return;

  if(!/^https?:\/\//i.test(value)){
    if(value.includes(".")&&!value.includes(" "))value="https://"+value;
    else{
      openExternal("https://www.google.com/search?q="+encodeURIComponent(value));
      return;
    }
  }
  openExternal(value);
}

function searchBrowser(){
  const input=document.getElementById("homeSearch");
  if(!input.value.trim())return;
  openExternal("https://www.google.com/search?q="+encodeURIComponent(input.value));
}

function openExternal(url){
  window.open(url,"_blank");
}

/* =========================================================
   MESSAGES
========================================================= */

function renderMessages(body){
  const contacts=Object.keys(state.chats);
  body.innerHTML=`
    <div class="chat">
      <div class="contacts" id="contactsList"></div>
      <div class="conversation">
        <div style="padding:13px;text-align:center;border-bottom:1px solid var(--border);font-weight:600" id="chatTitle"></div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-compose">
          <input id="chatInput" placeholder="iMessage">
          <button class="primary" onclick="sendMessage()">↑</button>
        </div>
      </div>
    </div>
  `;

  const list=body.querySelector("#contactsList");
  contacts.forEach(name=>{
    const el=document.createElement("div");
    el.className="contact"+(name===state.chat?" active":"");
    el.innerHTML=`<div class="avatar">${name[0]}</div><div><b>${name}</b><div class="muted" style="font-size:11px">iMessage</div></div>`;
    el.onclick=()=>{
      state.chat=name;
      renderMessages(body);
    };
    list.appendChild(el);
  });

  body.querySelector("#chatTitle").textContent=state.chat;

  const messages=body.querySelector("#chatMessages");
  state.chats[state.chat].forEach((m,i)=>{
    const b=document.createElement("div");
    b.className="bubble"+(i%2===1?" me":"");
    b.textContent=m;
    messages.appendChild(b);
  });
  messages.scrollTop=messages.scrollHeight;

  body.querySelector("#chatInput").addEventListener("keydown",e=>{
    if(e.key==="Enter")sendMessage();
  });
}

function sendMessage(){
  const w=state.windows.messages;
  if(!w)return;
  const input=w.querySelector("#chatInput");
  const text=input.value.trim();
  if(!text)return;
  state.chats[state.chat].push(text);
  input.value="";
  renderMessages(w.querySelector(".window-body"));
}

/* =========================================================
   CALENDAR
========================================================= */

let calDate=new Date();

function renderCalendar(body){
  function draw(){
    const y=calDate.getFullYear();
    const m=calDate.getMonth();
    const first=new Date(y,m,1).getDay();
    const days=new Date(y,m+1,0).getDate();
    const today=new Date();

    body.innerHTML=`
      <div class="calendar-head">
        <button class="toolbtn" onclick="calMove(-1)">‹</button>
        <h2>${calDate.toLocaleString([], {month:"long",year:"numeric"})}</h2>
        <button class="toolbtn" onclick="calMove(1)">›</button>
      </div>
      <div class="cal-grid" id="calGrid">
        ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="cal-head">${d}</div>`).join("")}
      </div>
      <div style="padding:0 20px 20px">
        <button class="primary" onclick="addCalendarEvent()">＋ Add Event</button>
      </div>
    `;

    const grid=body.querySelector("#calGrid");

    for(let i=0;i<first;i++){
      const blank=document.createElement("div");
      grid.appendChild(blank);
    }

    for(let d=1;d<=days;d++){
      const el=document.createElement("div");
      el.className="cal-day";
      if(
        d===today.getDate() &&
        m===today.getMonth() &&
        y===today.getFullYear()
      )el.classList.add("today");
      el.innerHTML=`<b>${d}</b>`;
      grid.appendChild(el);
    }
  }

  window.calMove=function(dir){
    calDate.setMonth(calDate.getMonth()+dir);
    draw();
  };

  window.addCalendarEvent=function(){
    showModal(`
      <h2>New Event</h2>
      <input id="eventName" class="search" style="width:100%" placeholder="Event name">
      <div class="modal-actions">
        <button class="secondary" onclick="closeModal()">Cancel</button>
        <button class="primary" onclick="saveCalendarEvent()">Add</button>
      </div>
    `);
  };

  window.saveCalendarEvent=function(){
    const n=document.getElementById("eventName").value.trim()||"New Event";
    closeModal();

function saveNotes(){

function renderNotes(body){
  body.innerHTML=`
    <div class="notes-layout">
      <div class="notes-list">
        <button class="primary" style="margin:10px;width:calc(100% - 20px)" onclick="newNote()">＋ New Note</button>
        <div id="notesList"></div>
      </div>
      <div class="note-editor">
        <input class="note-title" id="noteTitle">
        <textarea class="note-text" id="noteText"></textarea>
      </div>
    </div>
  `;

  function draw(){
    const list=body.querySelector("#notesList");
    list.innerHTML="";

    state.notes.forEach(note=>{
      const el=document.createElement("div");
      el.className="note-row"+(note.id===state.selectedNote?" active":"");
      el.innerHTML=`<b>${note.title||"Untitled"}</b><small class="muted">${(note.text||"").slice(0,40)}</small>`;
      el.onclick=()=>{
        state.selectedNote=note.id;
        draw();
        loadEditor();
      };
      list.appendChild(el);
    });
  }

  function loadEditor(){
    const note=state.notes.find(n=>n.id===state.selectedNote);
    if(!note)return;
    body.querySelector("#noteTitle").value=note.title;
    body.querySelector("#noteText").value=note.text;
  }

  body.querySelector("#noteTitle").oninput=e=>{
    const n=state.notes.find(n=>n.id===state.selectedNote);
    if(n){n.title=e.target.value;saveNotes();}
    draw();

  body.querySelector("#noteText").oninput=e=>{
    const n=state.notes.find(n=>n.id===state.selectedNote);
    if(n){n.text=e.target.value;saveNotes();}
  };

  draw();
  loadEditor();
}

function newNote(){
  const note={id:Date.now(),title:"New Note",text:""};
  state.notes.unshift(note);
  state.selectedNote=note.id;

function renderCalculator(body){
  body.innerHTML=`
    <div class="calc">
      <input class="calc-display" id="calcDisplay" value="0" readonly>
      <div class="calc-grid">
        ${["AC","±","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","0",".","⌫","="]
        .map(x=>`<button class="calc-btn ${["÷","×","−","+","="].includes(x)?"op":""}" onclick="calcPress('${x}')">${x}</button>`).join("")}
      </div>
    </div>
  `;
}

let calcValue="0";
let calcExpression="";

function calcPress(x){
  const d=document.getElementById("calcDisplay");
  if(!d)return;

  if(x==="AC"){
    calcValue="0";
    calcExpression="";
  }else if(x==="⌫"){
    calcValue=calcValue.length>1?calcValue.slice(0,-1):"0";
  }else if(x==="±"){
    calcValue=String(Number(calcValue)*-1);
  }else if(x==="%"){
    calcValue=String(Number(calcValue)/100);
  }else if(["+","−","×","÷"].includes(x)){
    calcExpression+=calcValue+x;
    calcValue="0";
  }else if(x==="="){
    try{
      let expr=(calcExpression+calcValue)
        .replaceAll("×","*")
        .replaceAll("÷","/")
        .replaceAll("−","-");
      if(!/^[0-9+\-*/. ()]+$/.test(expr))throw Error();
      calcValue=String(Function('"use strict";return ('+expr+')')());
      calcExpression="";
    }catch{
      calcValue="Error";
      calcExpression="";
    }
  }else{
    if(calcValue==="Error")calcValue="0";
    if(x==="." && calcValue.includes("."))return;
    calcValue=calcValue==="0"&&x!=="."?x:calcValue+x;
  }

  d.value=calcValue;
}

function renderTerminal(body){
  body.innerHTML=`
    <div class="terminal" id="terminal">
      <div class="term-output" id="termOutput">Last login: ${new Date().toLocaleString()}

Welcome to Web Terminal.
Type <b>help</b> to see available commands.

</div>
      <div class="term-line">
        <span>user@web-mac ~ %</span>
        <input class="term-input" id="termInput" autocomplete="off" spellcheck="false">
      </div>
    </div>
  `;

  const input=body.querySelector("#termInput");
  input.focus();

  input.addEventListener("keydown",e=>{
    if(e.key!=="Enter")return;

    const command=input.value.trim();
    input.value="";
    runTerminalCommand(command);
  });
}

function runTerminalCommand(command){
  const out=document.getElementById("termOutput");
  if(!out)return;

  const parts=command.split(" ");
  const cmd=parts[0].toLowerCase();

  let result="";

  switch(cmd){
    case "":
      break;
    case "help":
      result=
`Available commands:
  help       Show this help
  clear      Clear terminal
  date       Show date
  echo       Print text
  pwd        Show current folder
  ls         List files
  open       Open an app
  neofetch   Show system information`;
      break;

    case "clear":
      out.textContent="";
      return;

    case "date":
      result=new Date().toString();
      break;

    case "echo":
      result=parts.slice(1).join(" ");
      break;

    case "pwd":
      result="/Users/user";
      break;

    case "ls":
      result="Desktop  Documents  Downloads  Movies  Music  Pictures";
      break;

    case "open":
      if(!parts[1]){
        result="Usage: open <app>";
      }else{
        const target=Object.keys(apps).find(x=>x===parts[1].toLowerCase());
        if(target){
          openApp(target);
          result="Opening "+apps[target].name+"...";
        }else{
          result="Application not found.";
        }
      }
      break;

    case "neofetch":
      result=
`       .--.
      |o_o |
      |:_/ |
     //   \\ \\
    (|     | )
   /'\\_   _/\\
   \\___)=(___/

Web macOS
Browser: ${navigator.userAgent.split(" ").slice(-1)[0]}
Resolution: ${window.innerWidth}x${window.innerHeight}
Theme: ${state.dark?"Dark":"Light"}`;
      break;

    default:
      result=`zsh: command not found: ${cmd}`;
  }

  out.textContent+=`user@web-mac ~ % ${command}\n${result}\n`;
  const terminal=document.getElementById("terminal");
  terminal.scrollTop=terminal.scrollHeight;
}

function buildLaunchpad(){
  const grid=document.getElementById("launchGrid");
  grid.innerHTML="";

  Object.entries(apps).forEach(([id,a])=>{
    const el=document.createElement("div");
    el.className="launch-app";
    el.dataset.name=a.name.toLowerCase();
    el.innerHTML=`
      <div class="launch-icon">${a.icon}</div>
      <div class="launch-name">${a.name}</div>
    `;
    el.onclick=()=>{
      toggleLaunchpad(false);
      openApp(id);
    };
    grid.appendChild(el);
  });
}

function toggleLaunchpad(show){
  const lp=document.getElementById("launchpad");
  if(show){
    buildLaunchpad();
    lp.classList.add("show");
    setTimeout(()=>document.getElementById("launchSearch").focus(),50);
  }else{
    lp.classList.remove("show");
  }
}

document.getElementById("launchSearch").addEventListener("input",e=>{
  const q=e.target.value.toLowerCase();
  document.querySelectorAll(".launch-app").forEach(a=>{
    a.style.display=a.dataset.name.includes(q)?"block":"none";
  });
});

document.getElementById("launchpad").addEventListener("pointerdown",e=>{
  if(e.target.id==="launchpad")toggleLaunchpad(false);
});

/* =========================================================
   CONTROL CENTER
========================================================= */

document.getElementById("ccButton").onclick=e=>{
  e.stopPropagation();
  document.getElementById("controlCenter").classList.toggle("show");
};

function toggleCC(type){
  if(type==="wifi")state.wifi=!state.wifi;
  if(type==="bluetooth")state.bluetooth=!state.bluetooth;
  if(type==="focus")state.focus=!state.focus;
  updateCC();
}

function updateCC(){
  const w=document.getElementById("wifiCC");
  const b=document.getElementById("bluetoothCC");
  const f=document.getElementById("focusCC");

  w.classList.toggle("on",state.wifi);
  w.querySelector("span").textContent=state.wifi?"Connected":"Off";

  b.classList.toggle("on",state.bluetooth);
  b.querySelector("span").textContent=state.bluetooth?"On":"Off";

  f.classList.toggle("on",state.focus);
  f.querySelector("span").textContent=state.focus?"On":"Off";

  document.getElementById("darkCC").classList.toggle("on",state.dark);
}
updateCC();

document.getElementById("brightness").oninput=e=>{
  state.brightness=e.target.value;
  document.getElementById("desktop").style.filter=`brightness(${state.brightness/100})`;
};

document.getElementById("volume").oninput=e=>{
  state.volume=e.target.value;
};

document.addEventListener("pointerdown",e=>{
  const cc=document.getElementById("controlCenter");
  const btn=document.getElementById("ccButton");
  if(cc.classList.contains("show")&&!cc.contains(e.target)&&!btn.contains(e.target)){
    cc.classList.remove("show");
  }
});

/* =========================================================
   CONTEXT MENU
========================================================= */

document.getElementById("desktop").addEventListener("contextmenu",e=>{
  if(e.target.closest(".window")||e.target.closest("#dockWrap"))return;

  e.preventDefault();

  const menu=document.getElementById("contextMenu");
  menu.style.display="block";

  let x=e.clientX;
  let y=e.clientY;

  if(x+210>window.innerWidth)x=window.innerWidth-220;
  if(y+180>window.innerHeight)y=window.innerHeight-190;

  menu.style.left=x+"px";
  menu.style.top=y+"px";
});

document.addEventListener("pointerdown",e=>{
  if(!e.target.closest("#contextMenu")){
    document.getElementById("contextMenu").style.display="none";
  }
});

========================================================= */

function showModal(html){
  document.getElementById("modalBox").innerHTML=html;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

document.getElementById("modal").addEventListener("pointerdown",e=>{
  if(e.target.id==="modal")closeModal();
});

/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    toggleLaunchpad(false);
    document.getElementById("controlCenter").classList.remove("show");
    closeModal();
  }

  if((e.ctrlKey||e.metaKey)&&e.key===" "){
    e.preventDefault();
    toggleLaunchpad(true);
  }
});

   STARTUP
========================================================= */

setTimeout(()=>{
  showToast("Welcome to Web Mac");
},500);
