 w.t('Microsoft Edge');b.innerHTML='<div class="browserbar"><button class="bt" data-nav="back" title="Back">←</button><button class="bt" data-nav="reload" title="Reload">↻</button><input class="field" id="edgeurl" value="https://www.bing.com" aria-label="Address or search"><button class="bt primary" data-nav="go">Go</button><button class="bt" data-nav="new">↗</button></div><div class="apphead"><span style="font-size:25px">🌐</span><div><strong>Microsoft Edge</strong><div class="hint">A simple browser window</div></div></div><iframe class="browserframe" id="edgeframe" title="Web page" referrerpolicy="no-referrer"></iframe><div class="st">Some websites block embedding. Use ↗ to open the address in a new tab.</div>';
 const input=$('#edgeurl',b),frame=$('#edgeframe',b);let last='https://www.bing.com';
 const resolve=()=>{let q=input.value.trim();if(!q)return;if(!/^[a-zA-Z][a-zA-Z\d+.-]*:/.test(q)){q=/\s/.test(q)||!q.includes('.')?'https://www.bing.com/search?q='+encodeURIComponent(q):'https://'+q}return q};
 const go=()=>{const u=resolve();if(!u)return;last=u;input.value=u;frame.src=u;};
 b.querySelector('.browserbar').onclick=e=>{const k=e.target.dataset.nav;if(k==='go')go();if(k==='reload')frame.src=last;if(k==='back'){try{frame.contentWindow.history.back()}catch(_){}}if(k==='new'){const u=resolve();if(u)window.open(u,'_blank','noopener,noreferrer')}};
 input.onkeydown=e=>{if(e.key==='Enter')go()};go();
}
function storeApp(b,w){w.t('Microsoft Store');const items=[['🌐','Microsoft Edge','browser','Browse the web'],['📸','Photos','photos','View your pictures'],['🎵','Media Player','media','Listen to music'],['🌦️','Weather','weather','Weather dashboard'],['📊','Task Manager','taskmgr','Monitor running apps'],['🗒️','Sticky Notes','stick','Quick notes'],['🐍','Snake','snake','Classic arcade game'],['🔢','2048','g2048','Number puzzle'],['⭕','Tic-Tac-Toe','ttt','Play a quick game'],['🔑','Password Generator','pwgen','Generate a random password'],['📐','Unit Converter','conv','Convert common units'],['⌨️','Command Prompt','cmd','Try simulated commands']];
 b.innerHTML='<div class="apphead"><span style="font-size:30px">🛍️</span><div><strong>Microsoft Store</strong><div class="hint">Discover apps for your desktop</div></div></div><div class="appbody" style="padding:0"><div style="padding:12px"><input class="field" id="storesearch" placeholder="Search apps and games..."></div><div class="cards" id="storecards"></div></div>';
 const draw=()=>{$('#storecards',b).innerHTML='';const q=$('#storesearch',b).value.toLowerCase();items.filter(x=>(x[1]+' '+x[3]).toLowerCase().includes(q)).forEach(x=>{const d=el('div','storecard','<div class="emoji">'+x[0]+'</div><b>'+x[1]+'</b><span class="hint">'+x[3]+'</span><button class="bt primary" data-app="'+x[2]+'">Open</button>');$('#storecards',b).append(d)})};
 $('#storesearch',b).oninput=draw;$('#storecards',b).onclick=e=>{const q=e.target.closest('[data-app]');if(q){launch(q.dataset.app);toast(q.dataset.app+' opened')}};draw();
}
function mediaApp(b,w){w.t('Media Player');b.innerHTML='<div class="apphead"><span style="font-size:30px">🎵</span><div><strong>Media Player</strong><div class="hint">Play a local audio or video file</div></div></div><div class="appbody"><p>Choose a media file from your device. Files stay on your device and are not uploaded.</p><input type="file" class="field" id="mediafile" accept="audio/*,video/*"><div id="mediabox" style="margin-top:16px"></div><p class="hint">Tip: this player supports formats your browser can play.</p></div>';$('#mediafile',b).onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),box=$('#mediabox',b);box.innerHTML='';const m=document.createElement(f.type.startsWith('video/')?'video':'audio');m.controls=true;m.src=u;m.style.maxWidth='100%';m.style.width='100%';box.append(m);m.play().catch(()=>{})}}
function weatherApp(b,w){w.t('Weather');b.innerHTML='<div class="apphead"><span style="font-size:30px">🌦️</span><div><strong>Weather</strong><div class="hint">Live conditions require an internet connection</div></div></div><div class="appbody"><form id="weatherform" style="display:flex;gap:8px"><input class="field" id="weathercity" placeholder="Enter a city (e.g. Starkville, MS)" value="Starkville, MS"><button class="bt primary">Search</button></form><div id="weatherresult" style="padding:18px 0">Search the web for current weather.</div><button class="bt" id="weatherweb">Open weather search in browser</button></div>';$('#weatherform',b).onsubmit=e=>{e.preventDefault();const q=$('#weathercity',b).value.trim();$('#weatherresult',b).textContent='Weather for '+q+': open the web search below for current conditions.';$('#weatherweb',b).onclick=()=>window.open('https://www.bing.com/search?q='+encodeURIComponent('weather '+q),'_blank','noopener,noreferrer')};$('#weatherweb',b).onclick=()=>window.open('https://www.bing.com/search?q='+encodeURIComponent('weather '+$('#weathercity',b).value),'_blank','noopener,noreferrer')}
function taskmgrApp(b,w){w.t('Task Manager');b.innerHTML='<div class="apphead"><span style="font-size:28px">📊</span><div><strong>Task Manager</strong><div class="hint">Apps currently open in this simulation</div></div></div><div class="appbody"><div class="statgrid"><div class="statbox"><div class="hint">Open windows</div><h2 id="tmcount">0</h2></div><div class="statbox"><div class="hint">Memory</div><h2>Browser</h2><div class="hint">Usage varies by device</div></div></div><div style="margin-top:14px;border:1px solid var(--bd)" id="tmlist"></div></div>';
 const draw=()=>{if(!b.isConnected)return;$('#tmcount',b).textContent=W.length;$('#tmlist',b).innerHTML='<div class="tr th"><span>App</span><span>Status</span><span>Action</span></div>'+W.filter(x=>x!==w).map(x=>'<div class="tr"><span>'+x.e.querySelector('.tt').textContent+'</span><span>'+(x.e.classList.contains('h')?'Suspended':'Running')+'</span><button class="bt" data-close="'+x.id+'">End task</button></div>').join('')||'<div class="tr">No other apps are open.</div>'};
 const timer=setInterval(draw,800);b.addEventListener('DOMNodeRemoved',()=>clearInterval(timer),{once:true});b.onclick=e=>{const z=e.target.closest('[data-close]');if(z){const x=W.find(v=>v.id===z.dataset.close);if(x)x.close();draw()}};draw()}
Object.assign(APPS,{browser:{n:'Microsoft Edge',i:'🌐',w:800,h:560,f:browserApp},store:{n:'Microsoft Store',i:'🛍️',w:700,h:520,f:storeApp},media:{n:'Media Player',i:'🎵',w:620,h:440,f:mediaApp},weather:{n:'Weather',i:'🌦️',w:460,h:420,f:weatherApp},taskmgr:{n:'Task Manager',i:'📊',w:600,h:440,f:taskmgrApp}});
TL.push(['browser','🌐','Microsoft Edge','#087ea4'],['store','🛍️','Microsoft Store','#0878d1'],['media','🎵','Media Player','#713e9b'],['weather','🌦️','Weather','#2876b9'],['taskmgr','📊','Task Manager','#247b75']);
$('#tl').innerHTML=TL.map(([k,i,n,c,s])=>'<div class="tl" data-k="'+k+'" style="background:'+c+';grid-column:span '+(s||1)+'"><b>'+i+'</b>'+(n||new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'}))+'</div>').join('');
$('#tl').onclick=e=>{const t=e.target.closest('.tl');if(!t)return;closeAll();t.dataset.k==='cal'?tog('cal'):launch(t.dataset.k)};
$('#sb .sx').textContent='Search apps, settings, and the web';

</script></body></html>
