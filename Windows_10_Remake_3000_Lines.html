<!--
  Windows 10 Remake — readable source build
  This is a single-file HTML desktop simulator. It runs locally in a modern browser.

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windows 10</title>

<style>
:root {
  --ac:#0078d7;
  --wb:#fff;
  --wf:#111;
  --ws:#f2f2f2;
  --bd:#d0d0d0;
  --hv:#e5e5e5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}

@media(prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --wb:#1f1f1f;
    --wf:#f0f0f0;
    --ws:#2b2b2b;
    --bd:#444;
    --hv:#3a3a3a
  }
  
}

:root[data-theme="dark"] {
  --wb:#1f1f1f;
  --wf:#f0f0f0;
  --ws:#2b2b2b;
  --bd:#444;
  --hv:#3a3a3a
}

html,body {
  height:100%;
  margin:0;
  overflow:hidden
}

html {
  background:#101014
}

body {
  position:relative;
  background:#101014;
  font:13px/1.3 "Segoe UI",system-ui,sans-serif;
  color:#fff;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation
}

input,textarea {
  font:inherit;
  color:inherit;
  user-select:text;
  -webkit-user-select:text
}

#desk {
  position:absolute;
  inset:0 0 40px 0;
  overflow:hidden;
  background:#0a58b8
}

#ic {
  position:absolute;
  inset:0;
  padding:6px;
  display:grid;
  grid-auto-flow:column;
  grid-template-rows:repeat(auto-fill,86px);
  grid-auto-columns:82px;
  align-content:start
}

.ic {
  width:76px;
  height:80px;
  text-align:center;
  font-size:12px;
  text-shadow:0 1px 3px #000;
  border:1px solid transparent;
  padding:3px 2px;
  overflow:hidden
}

.ic b,.fi b {
  display:block;
  font-size:34px;
  font-weight:400;
  line-height:40px
}

.ic.s {
  background:rgba(255,255,255,.2);
  border-color:rgba(255,255,255,.4)
}

.win {
  position:absolute;
  display:flex;
  flex-direction:column;
  background:var(--wb);
  color:var(--wf);
  border:1px solid var(--bd);
  box-shadow:0 8px 30px rgba(0,0,0,.4);
  animation:pp .12s;
  min-width:260px;
  min-height:160px
}

.win.a {
  border-color:var(--ac)
}
.win.h {
  display:none
}

.win.m {
  inset:0!important;
  width:auto!important;
  height:auto!important
}
.win.m .rz {
  display:none
}

@keyframes pp {
  from {
    opacity:0;
    transform:scale(.95)
  }
  
}

.tb {
  display:flex;
  align-items:center;
  height:32px;
  flex:none;
  touch-action:none
}

.ti {
  padding:0 8px;
  font-size:15px
}
.tt {
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:12px
}

.tb button {
  border:0;
  background:none;
  color:inherit;
  width:46px;
  height:32px;
  font:13px sans-serif
}

.tb button:hover {
  background:var(--hv)
}
.tb .x:hover {
  background:#e81123;
  color:#fff
}

.bd {
  flex:1;
  min-height:0;
  overflow:auto;
  display:flex;
  flex-direction:column;
  background:var(--wb)
}

.rz {
  position:absolute;
  right:0;
  bottom:0;
  width:16px;
  height:16px;
  cursor:nwse-resize;
  touch-action:none
}

.mb {
  display:flex;
  flex:none;
  background:var(--ws);
  border-bottom:1px solid var(--bd);
  align-items:center
}

.mb button,.bt {
  border:0;
  background:none;
  color:inherit;
  padding:5px 10px;
  font:inherit
}

.mb button:hover {
  background:var(--hv)
}

.bt {
  border:1px solid var(--bd);
  background:var(--ws);
  padding:6px 16px
}
.bt:hover {
  border-color:var(--ac)
}

.st {
  flex:none;
  padding:2px 8px;
  background:var(--ws);
  border-top:1px solid var(--bd);
  font-size:12px
}

.bd textarea {
  flex:1;
  min-height:0;
  border:0;
  outline:0;
  resize:none;
  background:var(--wb);
  padding:6px;
  font:15px Consolas,monospace
}

.xn {
  display:flex;
  gap:4px;
  padding:4px;
  flex:none;
  background:var(--ws);
  border-bottom:1px solid var(--bd)
}

.xn button {
  border:0;
  background:none;
  color:inherit;
  width:30px;
  font-size:16px
}
.xn button:hover,.sl:hover,.fi:hover {
  background:var(--hv)
}

.ad {
  flex:1;
  border:1px solid var(--bd);
  background:var(--wb);
  padding:3px 8px;
  overflow:hidden;
  white-space:nowrap
}

.xm {
  flex:1;
  display:flex;
  min-height:0
}
.sd2 {
  width:130px;
  flex:none;
  border-right:1px solid var(--bd);
  padding:6px 0;
  overflow:auto
}

.sl {
  padding:5px 12px
}

.fl {
  flex:1;
  overflow:auto;
  padding:8px;
  display:grid;
  grid-template-columns:repeat(auto-fill,88px);
  grid-auto-rows:92px;
  gap:4px;
  align-content:start
}

.fi {
  text-align:center;
  font-size:12px;
  padding:4px;
  overflow:hidden;
  word-break:break-word
}
.fi.s {
  background:rgba(0,120,215,.25);
  outline:1px solid var(--ac)
}

.cd {
  flex:none;
  padding:10px 14px;
  text-align:right;
  background:var(--ws)
}
.ce {
  height:18px;
  font-size:13px;
  opacity:.7
}
.cr {
  font-size:38px;
  font-weight:300;
  overflow:hidden
}

.cl {
  flex:1;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:2px;
  padding:2px;
  background:var(--ws)
}

.cl button {
  border:0;
  background:var(--hv);
  color:var(--wf);
  font:18px "Segoe UI",sans-serif
}
.cl .nm {
  background:var(--wb);
  font-weight:600
}

.cl button:hover {
  filter:brightness(.92)
}
.cl .eq {
  background:var(--ac);
  color:#fff
}

.sg {
  padding:16px
}
.sg h2 {
  margin:0 0 8px;
  font:300 26px "Segoe UI",sans-serif
}
.sg h4 {
  margin:16px 0 8px;
  font-size:14px
}

.sw {
  display:inline-block;
  width:42px;
  height:42px;
  margin:0 6px 6px 0;
  border:2px solid transparent;
  cursor:pointer
}
.sw:hover {
  border-color:var(--wf)
}
.wp {
  width:84px
}

.cm {
  background:#0c0c0c;
  color:#ccc;
  font:14px Consolas,monospace;
  padding:6px
}
.cm .o {
  white-space:pre-wrap;
  margin:0;
  flex:none
}

.ln {
  display:flex
}
.ln input {
  flex:1;
  background:none;
  border:0;
  outline:0;
  color:#ccc;
  font:14px Consolas,monospace
}

#tbar {
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:40px;
  background:rgba(18,18,22,.96);
  display:flex;
  z-index:9999
}

#tbar>* {
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  position:relative
}

.tbtn {
  width:46px;
  font-size:19px
}
.tbtn:hover,#sb:hover {
  background:rgba(255,255,255,.14)
}

.tbtn.on::after {
  content:"";
  position:absolute;
  bottom:0;
  left:10px;
  right:10px;
  height:2px;
  background:#999
}

.tbtn.fo {
  background:rgba(255,255,255,.18)
}
.tbtn.fo::after {
  background:var(--ac)
}

.lg {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:2px;
  width:18px;
  height:18px
}
.lg i {
  background:#fff
}

#sb {
  width:240px;
  height:32px!important;
  margin:0 6px;
  background:#f3f3f3;
  color:#555;
  justify-content:flex-start!important;
  gap:8px;
  padding:0 10px
}

#apps {
  flex:1;
  min-width:0;
  overflow:hidden;
  justify-content:flex-start
}

.tray {
  gap:10px;
  padding:0 8px
}

#clk {
  display:block;
  text-align:center;
  line-height:20px;
  padding:0 8px;
  font-size:12px
}

#sd {
  width:7px;
  border-left:1px solid #777
}

.pop {
  position:absolute;
  bottom:40px;
  z-index:9998;
  background:rgba(28,28,32,.97);
  color:#fff;
  display:none
}

.pop.o {
  display:flex
}

#start {
  left:0;
  width:min(100%,650px);
  height:min(580px,calc(100% - 40px))
}

.rail {
  width:48px;
  flex:none;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  background:rgba(0,0,0,.25)
}

.rail div {
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px
}

.rail div:hover,.li:hover,#pw div:hover {
  background:rgba(255,255,255,.15)
}

.lst {
  width:250px;
  flex:none;
  display:flex;
  flex-direction:column;
  min-height:0
}

#q {
  margin:8px;
  padding:8px;
  border:0;
  background:#fff;
  color:#111
}

#al {
  flex:1;
  overflow:auto
}
#al h6 {
  margin:0;
  padding:8px 14px 2px;
  font-size:12px;
  color:#aaa
}

.li {
  display:flex;
  gap:12px;
  align-items:center;
  height:40px;
  padding:0 14px
}

.tls {
  flex:1;
  padding:12px;
  display:grid;
  grid-template-columns:repeat(3,92px);
  grid-auto-rows:92px;
  gap:4px;
  align-content:start;
  overflow:auto
}

.tl {
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:8px;
  font-size:12px
}
.tl b {
  font-size:28px;
  font-weight:400
}
.tl:hover {
  outline:2px solid rgba(255,255,255,.5)
}

#pw {
  left:48px;
  bottom:42px;
  width:150px;
  flex-direction:column
}
#pw div {
  padding:10px 14px
}

#ac {
  right:0;
  width:min(100%,360px);
  height:calc(100% - 40px);
  flex-direction:column;
  padding:10px;
  gap:8px
}

.ah {
  display:flex;
  justify-content:space-between;
  font-size:15px
}
.ah u {
  font-size:12px;
  cursor:pointer
}

#nt {
  flex:1;
  overflow:auto
}
#nt:empty::before {
  content:"No new notifications";
  opacity:.6
}

.nc {
  background:#3a3a3e;
  padding:10px;
  margin-bottom:6px;
  font-size:12px
}

#qa {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px
}

.qt {
  background:#3a3a3e;
  height:70px;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  text-align:center
}

.qt.on {
  background:var(--ac)
}
.qt b {
  font-size:20px;
  font-weight:400
}

.br {
  display:flex;
  gap:8px;
  align-items:center
}
.br input {
  flex:1
}

#cal {
  right:0;
  width:min(100%,300px);
  padding:14px;
  flex-direction:column;
  gap:8px
}

#ct {
  font-size:44px;
  font-weight:200
}
.cn {
  display:flex;
  justify-content:space-between;
  align-items:center
}
.cn b {
  padding:2px 12px;
  cursor:pointer
}

#cg {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:2px;
  text-align:center
}
#cg span {
  padding:7px 0
}
.dw {
  opacity:.6;
  font-size:11px
}
.td {
  background:var(--ac)
}

#cx {
  position:fixed;
  z-index:99000;
  background:var(--ws);
  color:var(--wf);
  border:1px solid var(--bd);
  box-shadow:0 4px 14px #0006;
  display:none;
  min-width:190px;
  padding:2px 0
}

#cx.o {
  display:block
}
#cx div {
  padding:7px 28px
}
#cx div:hover {
  background:var(--hv)
}

#ts {
  position:absolute;
  right:8px;
  bottom:48px;
  width:min(300px,calc(100% - 16px));
  padding:12px;
  background:#2b2b2b;
  color:#fff;
  border-left:3px solid var(--ac);
  transform:translateX(110%);
  transition:transform .25s;
  z-index:9997
}

#ts.o {
  transform:none
}

#lock {
  position:fixed;
  inset:0;
  z-index:99998;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:8vh 6vw;
  transition:transform .5s;
  cursor:pointer;
  text-shadow:0 2px 8px #0008;
  box-shadow:inset 0 0 0 100vmax rgba(0,0,0,.25)
}

#lock.u {
  transform:translateY(-100%)
}
#lt {
  font-size:min(20vw,110px);
  font-weight:200;
  line-height:1
}
#ld {
  font-size:min(7vw,34px);
  font-weight:300;
  margin-bottom:12px
}

#off {
  position:fixed;
  inset:0;
  background:#000;
  color:#fff;
  z-index:99999;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:22px
}

.sp {
  width:34px;
  height:34px;
  border:3px solid #fff3;
  border-top-color:#fff;
  border-radius:50%;
  animation:rt 1s linear infinite;
  margin-bottom:16px
}
@keyframes rt {
  to {
    transform:rotate(360deg)
  }
  
}

#dim,#nl {
  position:fixed;
  inset:0;
  pointer-events:none
}
#dim {
  background:#000;
  opacity:0;
  z-index:99990
}
#nl {
  background:rgba(255,150,0,.2);
  mix-blend-mode:multiply;
  z-index:99989;
  display:none
}

.pop,#tbar {
  backdrop-filter:blur(24px) saturate(1.5);
  -webkit-backdrop-filter:blur(24px) saturate(1.5)
}

.pop {
  background:rgba(24,24,30,.82)
}
#tbar {
  background:rgba(14,14,18,.8)
}

body.nb .pop,body.nb #tbar {
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  background:#1c1c20
}

.win.sl2 {
  inset:0 50% 0 0!important;
  width:auto!important;
  height:auto!important
}
.win.sr2 {
  inset:0 0 0 50%!important;
  width:auto!important;
  height:auto!important
}
.win.sl2 .rz,.win.sr2 .rz {
  display:none
}

#boot {
  position:fixed;
  inset:0;
  background:#000;
  z-index:100001;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:40px
}

.lg.big {
  width:88px;
  height:88px;
  gap:5px
}
.lg.big i {
  background:#2f95ea
}

#tvw {
  position:absolute;
  left:0;
  right:0;
  top:0;
  bottom:40px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);
  z-index:9990;
  display:none;
  flex-wrap:wrap;
  gap:16px;
  padding:24px;
  align-content:center;
  justify-content:center;
  overflow:auto
}

.tvc {
  width:210px;
  height:140px;
  background:var(--wb);
  color:var(--wf);
  border:1px solid var(--bd);

  flex-direction:column
}
.tvc:hover {

}

.tvc b {

}
.tvc u {

.tvc u:hover {

  color:#fff
}
.tvc span {

}

.dlg {

  display:flex;

  justify-content:center
}

.dbox {

.bs {

/* Small DOM helpers scoped to the expansion pack. */
const XTOOLS = {
  esc(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  },
  button(label, action, extra = '') {
    return '<button class="bt" data-xaction="' + action + '" ' + extra + '>' + label + '</button>';
  },
  field(label, id, value = '', type = 'text') {
    return '<label style="display:block;margin:10px 0">' + label +
      '<input id="' + id + '" type="' + type + '" value="' +
      this.esc(value) + '" style="display:block;width:100%;padding:9px;margin-top:5px">' +
      '</label>';
  },
  section(title, body) {
    return '<section style="padding:12px;margin:10px 0;border:1px solid var(--ln,#ccc);border-radius:8px">' +
      '<h3 style="margin:0 0 10px">' + title + '</h3>' + body + '</section>';
  },
  bindButtons(root, handler) {
    root.addEventListener('click', event => {
      const button = event.target.closest('[data-xaction]');
      if (button) handler(button.dataset.xaction, button, event);
    });
  },
  download(filename, content, mime = 'text/plain') {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
};

/* ---------------------------------------------------------------------
   Stopwatch — start, pause, reset, and record lap times.
   --------------------------------------------------------------------- */
function stopwatchTool(b, w) {
  w.t('Stopwatch');
  b.innerHTML = `
    <div style="padding:18px;text-align:center">
      <div style="font-size:42px;font-variant-numeric:tabular-nums" id="swDisplay">00:00.00</div>
      <p style="color:var(--mut,#666)">A simple precision stopwatch</p>
      <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
        <button class="bt" data-xaction="start">▶ Start</button>
        <button class="bt" data-xaction="lap">＋ Lap</button>
        <button class="bt" data-xaction="reset">↺ Reset</button>
      </div>
      <ol id="swLaps" style="text-align:left;max-height:230px;overflow:auto"></ol>
    </div>`;
  let running = false;
  let startedAt = 0;
  let elapsed = 0;
  let raf = 0;
  let lapNumber = 0;
  const display = b.querySelector('#swDisplay');
  const laps = b.querySelector('#swLaps');
  const format = ms => {
    const centiseconds = Math.floor(ms / 10) % 100;
    const seconds = Math.floor(ms / 1000) % 60;
    const minutes = Math.floor(ms / 60000) % 60;
    const hours = Math.floor(ms / 3600000);
    const pad = n => String(n).padStart(2, '0');
    return (hours ? pad(hours) + ':' : '') + pad(minutes) + ':' +
      pad(seconds) + '.' + pad(centiseconds);
  };
  const render = () => {
    const value = elapsed + (running ? performance.now() - startedAt : 0);
    display.textContent = format(value);
    if (running) raf = requestAnimationFrame(render);
  };
  XTOOLS.bindButtons(b, action => {
    if (action === 'start') {
      if (running) {
        elapsed += performance.now() - startedAt;
        running = false;
        cancelAnimationFrame(raf);
        b.querySelector('[data-xaction="start"]').textContent = '▶ Resume';
      } else {
        startedAt = performance.now();
        running = true;
        b.querySelector('[data-xaction="start"]').textContent = 'Ⅱ Pause';
        render();
      }
    }
    if (action === 'lap') {
      const value = elapsed + (running ? performance.now() - startedAt : 0);
      lapNumber += 1;
      const li = document.createElement('li');
      li.textContent = 'Lap ' + lapNumber + ' — ' + format(value);
      laps.prepend(li);
    }
    if (action === 'reset') {
      running = false;
      elapsed = 0;
      lapNumber = 0;
      cancelAnimationFrame(raf);
      display.textContent = '00:00.00';
      laps.innerHTML = '';
      b.querySelector('[data-xaction="start"]').textContent = '▶ Start';
    }
  });
  w.close = ((oldClose) => () => { cancelAnimationFrame(raf); oldClose(); })(w.close);
}

/* ---------------------------------------------------------------------
   Countdown timer — configurable minutes and seconds with an alert.
   --------------------------------------------------------------------- */
function countdownTool(b, w) {
  w.t('Timer');
  b.innerHTML = `
    <div style="padding:18px">
      <h2 style="text-align:center" id="timerReadout">05:00</h2>
      <div style="display:flex;gap:8px">
        <label style="flex:1">Minutes<input id="timerMinutes" type="number" min="0" max="999" value="5" style="width:100%;padding:8px"></label>
        <label style="flex:1">Seconds<input id="timerSeconds" type="number" min="0" max="59" value="0" style="width:100%;padding:8px"></label>
      </div>
      <div style="display:flex;gap:8px;margin:14px 0;justify-content:center">
        <button class="bt" data-xaction="begin">▶ Start</button>
        <button class="bt" data-xaction="pause">Ⅱ Pause</button>
        <button class="bt" data-xaction="clear">↺ Reset</button>
      </div>
      <p id="timerStatus" aria-live="polite">Ready when you are.</p>
      <progress id="timerProgress" value="0" max="300" style="width:100%"></progress>
    </div>`;
  let remaining = 300;
  let total = 300;
  let interval = null;
  const readout = b.querySelector('#timerReadout');
  const status = b.querySelector('#timerStatus');
  const progress = b.querySelector('#timerProgress');
  const show = () => {
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    readout.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    progress.max = Math.max(total, 1);
    progress.value = total - remaining;
  };
  const stop = () => { clearInterval(interval); interval = null; };
  XTOOLS.bindButtons(b, action => {
    if (action === 'begin' && !interval) {
      if (remaining <= 0) {
        const mins = Math.max(0, Math.min(999, Number(b.querySelector('#timerMinutes').value) || 0));
        const secs = Math.max(0, Math.min(59, Number(b.querySelector('#timerSeconds').value) || 0));
        remaining = mins * 60 + secs;
        total = remaining;
      }
      if (!remaining) { status.textContent = 'Choose a duration first.'; return; }
      status.textContent = 'Timer running…';
      interval = setInterval(() => {
        remaining -= 1;
        show();
        if (remaining <= 0) {
          remaining = 0;
          stop();
          status.textContent = '⏰ Time is up!';
          try { if (navigator.vibrate) navigator.vibrate([150, 80, 150]); } catch (_) {}
          toast('Timer finished!');
        }
      }, 1000);
    }
    if (action === 'pause') { stop(); status.textContent = 'Paused.'; }
    if (action === 'clear') {
      stop();
      remaining = Math.max(0, Number(b.querySelector('#timerMinutes').value) || 0) * 60 +
        Math.max(0, Math.min(59, Number(b.querySelector('#timerSeconds').value) || 0));
      total = remaining;
      status.textContent = 'Ready when you are.';
      show();
    }
  });
  w.close = ((oldClose) => () => { stop(); oldClose(); })(w.close);
  show();
}

    summary = values.map(([label, value]) => label + ': ' + value).join('\n');
  };
  input.addEventListener('input', update);
  XTOOLS.bindButtons(b, action => {
    if (action === 'clear') { input.value = ''; update(); input.focus(); }
    if (action === 'copy') {
      if (navigator.clipboard && navigator.clipboard.writeText) {

/* ---------------------------------------------------------------------
   Color Studio — live HEX/RGB/HSL values with copyable color codes.
   --------------------------------------------------------------------- */
function colorStudioTool(b, w) {
  w.t('Color Studio');
  b.innerHTML = `
    <div style="padding:16px">
      <h2>Color Studio</h2>
      <div id="colorPreview" style="height:110px;border-radius:10px;background:#0078d7;border:1px solid #888"></div>
      <label style="display:block;margin:12px 0">Pick a color <input id="colorPicker" type="color" value="#0078d7" style="width:100%;height:45px"></label>
      <label style="display:block;margin:12px 0">HEX <input id="colorHex" value="#0078d7" style="width:100%;padding:8px"></label>
      <p id="colorRgb">RGB: 0, 120, 215</p>
      <p id="colorHsl">HSL: 207°, 100%, 42%</p>
      <button class="bt" data-xaction="copyhex">Copy HEX</button>
      <button class="bt" data-xaction="random">Random color</button>
      <button class="bt" data-xaction="invert">Invert</button>
    </div>`;
  const picker = b.querySelector('#colorPicker');
  const hex = b.querySelector('#colorHex');
  const preview = b.querySelector('#colorPreview');
  const rgbText = b.querySelector('#colorRgb');
  const hslText = b.querySelector('#colorHsl');
  const update = value => {
    if (!/^#[0-9a-f]{6}$/i.test(value)) return;
    picker.value = value;
    hex.value = value.toLowerCase();
    preview.style.background = value;
    const r = parseInt(value.slice(1, 3), 16);
    const g = parseInt(value.slice(3, 5), 16);
    const bl = parseInt(value.slice(5, 7), 16);
    rgbText.textContent = 'RGB: ' + r + ', ' + g + ', ' + bl;
    const rr = r / 255, gg = g / 255, bb = bl / 255;
    const max = Math.max(rr, gg, bb), min = Math.min(rr, gg, bb);
    let h = 0, s = 0, l = (max + min) / 2;
    if (max !== min) {
      const d = max - min;
      s = l > .5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case rr: h = (gg - bb) / d + (gg < bb ? 6 : 0); break;
        case gg: h = (bb - rr) / d + 2; break;
        default: h = (rr - gg) / d + 4;
      }
      h /= 6;
    }
    hslText.textContent = 'HSL: ' + Math.round(h * 360) + '°, ' + Math.round(s * 100) + '%, ' + Math.round(l * 100) + '%';
  };
  picker.addEventListener('input', () => update(picker.value));
  hex.addEventListener('change', () => update(hex.value));
  XTOOLS.bindButtons(b, action => {
    if (action === 'random') update('#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0'));
    if (action === 'invert') {
      const n = parseInt(hex.value.slice(1), 16) ^ 0xffffff;
      update('#' + n.toString(16).padStart(6, '0'));
    }
    if (action === 'copyhex') {
      navigator.clipboard?.writeText(hex.value).then(() => toast('Color copied')).catch(() => toast(hex.value));
    }
  });
}

/* ---------------------------------------------------------------------
   World Clock — view several time zones and refresh automatically.
   --------------------------------------------------------------------- */
function worldClockTool(b, w) {
  w.t('World Clock');
  const zones = [
    ['Local time', Intl.DateTimeFormat().resolvedOptions().timeZone],
    ['New York', 'America/New_York'],
    ['Los Angeles', 'America/Los_Angeles'],
    ['London', 'Europe/London'],
    ['Paris', 'Europe/Paris'],
    ['Tokyo', 'Asia/Tokyo'],
    ['Sydney', 'Australia/Sydney'],
    ['UTC', 'UTC']
  ];
  b.innerHTML = '<div style="padding:14px"><h2>World Clock</h2><div id="worldClockList"></div><p style="color:var(--mut,#666)">Times update every second using your device clock.</p></div>';
  const list = b.querySelector('#worldClockList');
  const render = () => {
    const now = new Date();
    list.innerHTML = zones.map(([name, zone]) => {
      let value;
      try { value = new Intl.DateTimeFormat(undefined, { timeZone: zone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).format(now); }
      catch (_) { value = 'Time zone unavailable'; }
      let date;
      try { date = new Intl.DateTimeFormat(undefined, { timeZone: zone, weekday: 'short', month: 'short', day: 'numeric' }).format(now); }
      catch (_) { date = ''; }
      return '<div style="display:flex;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid var(--ln,#ddd)"><div><b>' + XTOOLS.esc(name) + '</b><div style="font-size:12px;color:var(--mut,#666)">' + XTOOLS.esc(zone) + '</div></div><div style="text-align:right"><b>' + XTOOLS.esc(value) + '</b><div style="font-size:12px;color:var(--mut,#666)">' + XTOOLS.esc(date) + '</div></div></div>';
    }).join('');
  };
  render();
  const timer = setInterval(render, 1000);
  w.close = ((oldClose) => () => { clearInterval(timer); oldClose(); })(w.close);
}

/* ---------------------------------------------------------------------
   Focus Session — a small Pomodoro timer with a configurable work block.
   --------------------------------------------------------------------- */
function focusTool(b, w) {
  w.t('Focus Session');
  b.innerHTML = `
    <div style="padding:18px;text-align:center">
      <h2>Focus Session</h2>
      <p>Choose a work interval, then focus until the timer ends.</p>
      <label>Work minutes <input id="focusMinutes" type="number" min="1" max="180" value="25" style="width:80px;padding:8px"></label>
      <div id="focusClock" style="font-size:52px;font-weight:600;margin:18px 0;font-variant-numeric:tabular-nums">25:00</div>
      <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
        <button class="bt" data-xaction="start">Start focus</button>
        <button class="bt" data-xaction="pause">Pause</button>
        <button class="bt" data-xaction="reset">Reset</button>
      </div>
      <p id="focusMessage" aria-live="polite">Ready to focus?</p>
      <progress id="focusProgress" value="0" max="1500" style="width:100%"></progress>
    </div>`;
  let duration = 1500;
  let left = duration;
  let timer = null;
  const clock = b.querySelector('#focusClock');
  const message = b.querySelector('#focusMessage');
  const progress = b.querySelector('#focusProgress');
  const render = () => {
    clock.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
    progress.max = duration;
    progress.value = duration - left;
  };
  const stop = () => { clearInterval(timer); timer = null; };
  XTOOLS.bindButtons(b, action => {
    if (action === 'start' && !timer) {
      if (left <= 0) {
        duration = Math.max(1, Math.min(180, Number(b.querySelector('#focusMinutes').value) || 25)) * 60;
        left = duration;
      }
      message.textContent = 'Focus mode is running. You’ve got this!';
      timer = setInterval(() => {
        left -= 1;
        render();
        if (left <= 0) {
          left = 0;
          stop();
          message.textContent = 'Session complete — take a short break.';
          toast('Focus session complete!');
          render();
        }
      }, 1000);
    }
    if (action === 'pause') { stop(); message.textContent = 'Session paused.'; }
    if (action === 'reset') {
      stop();
      duration = Math.max(1, Math.min(180, Number(b.querySelector('#focusMinutes').value) || 25)) * 60;
      left = duration;
      message.textContent = 'Ready to focus?';
      render();
    }
  });
  w.close = ((oldClose) => () => { stop(); oldClose(); })(w.close);
  render();
}

function markdownTool(b, w) {
  w.t('Markdown Preview');
  b.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;height:100%;padding:10px;min-height:280px">
      <div style="display:flex;flex-direction:column;min-height:0"><h3>Markdown</h3><textarea id="mdSource" style="flex:1;min-height:220px;padding:10px;font-family:monospace" placeholder="# Hello\n\nWrite **bold** text here."></textarea><button class="bt" data-xaction="sample">Load example</button><button class="bt" data-xaction="save">Download .md</button></div>

    </div>`;
  const source = b.querySelector('#mdSource');
  const preview = b.querySelector('#mdPreview');
  const render = () => {
    let html = XTOOLS.esc(source.value);
    html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>')
      .replace(/^## (.*)$/gm, '<h2>$1</h2>')
      .replace(/^# (.*)$/gm, '<h1>$1</h1>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/^\- (.*)$/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
      .replace(/\n/g, '<br>');
    preview.innerHTML = html || '<span style="color:var(--mut,#666)">Your preview will appear here.</span>';
  };
  source.addEventListener('input', render);
  XTOOLS.bindButtons(b, action => {
    if (action === 'sample') {

      render();
    }
    if (action === 'save') XTOOLS.download('notes.md', source.value, 'text/markdown');
  });
  render();
}

/* Unit Converter Pro supports common length, mass, temperature, and data units. */
function unitConverterProTool(b, w) {
  w.t('Unit Converter Pro');
  const groups = {
    Length: { meters: 1, kilometers: 1000, centimeters: .01, millimeters: .001, miles: 1609.344, yards: .9144, feet: .3048, inches: .0254 },
    Mass: { kilograms: 1, grams: .001, milligrams: .000001, pounds: .45359237, ounces: .028349523125, stones: 6.35029318 },
    Data: { bytes: 1, kilobytes: 1000, megabytes: 1000000, gigabytes: 1000000000, kibibytes: 1024, mebibytes: 1048576, gibibytes: 1073741824 },
    Volume: { liters: 1, milliliters: .001, gallonsUS: 3.785411784, quartsUS: .946352946, cupsUS: .2365882365, tablespoonsUS: .0147867648 },
    Speed: { metersPerSecond: 1, kilometersPerHour: 1 / 3.6, milesPerHour: .44704, knots: .514444 }
  };
  b.innerHTML = `
    <div style="padding:16px">
      <h2>Unit Converter Pro</h2>
      <label style="display:block;margin:10px 0">Category<select id="ucCategory" style="display:block;width:100%;padding:9px"></select></label>
      <label style="display:block;margin:10px 0">From<select id="ucFrom" style="display:block;width:100%;padding:9px"></select></label>
      <label style="display:block;margin:10px 0">Amount<input id="ucAmount" type="number" value="1" style="display:block;width:100%;padding:9px"></label>
      <label style="display:block;margin:10px 0">To<select id="ucTo" style="display:block;width:100%;padding:9px"></select></label>
      <div id="ucResult" style="font-size:25px;font-weight:600;padding:14px;border-radius:8px;background:var(--card,#eee);overflow-wrap:anywhere"></div>
      <p style="color:var(--mut,#666)">Temperature conversions are handled separately using exact Celsius/Fahrenheit/Kelvin formulas.</p>
    </div>`;
  const category = b.querySelector('#ucCategory');
  const from = b.querySelector('#ucFrom');
  const to = b.querySelector('#ucTo');
  const amount = b.querySelector('#ucAmount');
  const result = b.querySelector('#ucResult');
  const allGroups = { ...groups, Temperature: { Celsius: 1, Fahrenheit: 1, Kelvin: 1 } };
  category.innerHTML = Object.keys(allGroups).map(name => '<option>' + name + '</option>').join('');
  const fillUnits = () => {
    const names = Object.keys(allGroups[category.value]);
    from.innerHTML = names.map(name => '<option>' + name + '</option>').join('');
    to.innerHTML = names.map((name, index) => '<option' + (index === 1 ? ' selected' : '') + '>' + name + '</option>').join('');
    convert();
  };
  const convertTemperature = (value, source, target) => {
    let celsius = value;
    if (source === 'Fahrenheit') celsius = (value - 32) * 5 / 9;
    if (source === 'Kelvin') celsius = value - 273.15;
    if (target === 'Fahrenheit') return celsius * 9 / 5 + 32;
    if (target === 'Kelvin') return celsius + 273.15;
    return celsius;
  };
  const convert = () => {
    const value = Number(amount.value);
    if (!Number.isFinite(value)) { result.textContent = 'Enter a valid number.'; return; }
    let converted;
    if (category.value === 'Temperature') converted = convertTemperature(value, from.value, to.value);
    else converted = value * allGroups[category.value][from.value] / allGroups[category.value][to.value];
    result.textContent = Number(converted.toPrecision(12)).toLocaleString() + ' ' + to.value;
  };
  category.addEventListener('change', fillUnits);
  from.addEventListener('change', convert);
  to.addEventListener('change', convert);
  amount.addEventListener('input', convert);
  fillUnits();
}

/* Password Lab scores a password locally; it never sends the password anywhere. */
function passwordLabTool(b, w) {
  w.t('Password Lab');
  b.innerHTML = `
    <div style="padding:16px">
      <h2>Password Lab</h2>
      <p>Check a password's rough strength on this device. This is a guide, not a guarantee.</p>
      <label style="display:block">Password<input id="plPassword" type="password" autocomplete="off" style="display:block;width:100%;padding:10px;margin:8px 0"></label>
      <label><input id="plReveal" type="checkbox"> Show password</label>
      <div style="height:9px;border-radius:9px;background:var(--ln,#ddd);overflow:hidden;margin:14px 0"><div id="plMeter" style="height:100%;width:0%;transition:width .2s"></div></div>
      <h3 id="plLabel">Enter a password</h3>
      <p id="plBits">Estimated entropy: —</p>
      <ul id="plAdvice"></ul>
      <button class="bt" data-xaction="generate">Generate strong password</button>
      <button class="bt" data-xaction="copy">Copy password</button>
      <p style="font-size:12px;color:var(--mut,#666)">Avoid reusing passwords. Never share a real password with anyone.</p>
    </div>`;
  const input = b.querySelector('#plPassword');
  const reveal = b.querySelector('#plReveal');
  const meter = b.querySelector('#plMeter');
  const label = b.querySelector('#plLabel');
  const bits = b.querySelector('#plBits');
  const advice = b.querySelector('#plAdvice');
  const update = () => {
    const value = input.value;
    let pool = 0;
    if (/[a-z]/.test(value)) pool += 26;
    if (/[A-Z]/.test(value)) pool += 26;
    if (/[0-9]/.test(value)) pool += 10;
    if (/[^A-Za-z0-9]/.test(value)) pool += 33;
    const entropy = value && pool ? Math.round(value.length * Math.log2(pool)) : 0;
    const score = Math.max(0, Math.min(100, entropy / 1.2));
    meter.style.width = score + '%';
    label.textContent = !value ? 'Enter a password' : score < 25 ? 'Very weak' : score < 45 ? 'Weak' : score < 65 ? 'Fair' : score < 85 ? 'Strong' : 'Very strong';
    bits.textContent = 'Estimated entropy: ' + (value ? entropy + ' bits (rough estimate)' : '—');
    const tips = [];
    if (value.length < 12) tips.push('Use at least 12 characters; longer is generally better.');
    if (!/[a-z]/.test(value) || !/[A-Z]/.test(value)) tips.push('Consider mixing upper- and lowercase letters.');
    if (!/[0-9]/.test(value)) tips.push('Add numbers if they help you make a memorable unique password.');
    if (!/[^A-Za-z0-9]/.test(value)) tips.push('Consider adding symbols or using a longer passphrase.');
    if (/(.)\1{2,}/.test(value)) tips.push('Avoid repeated characters.');
    if (/password|qwerty|123456|letmein/i.test(value)) tips.push('Avoid common words and predictable sequences.');
    if (!tips.length && value) tips.push('Good signs. Make sure it is unique to this account.');
    advice.innerHTML = tips.map(tip => '<li>' + XTOOLS.esc(tip) + '</li>').join('');
  };
  input.addEventListener('input', update);
  reveal.addEventListener('change', () => { input.type = reveal.checked ? 'text' : 'password'; });
  XTOOLS.bindButtons(b, action => {
    if (action === 'generate') {
      const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%_-+=';
      const bytes = new Uint32Array(20);
      if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
      else for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 4294967296);
      input.value = Array.from(bytes, n => alphabet[n % alphabet.length]).join('');
      update();
    }

function scientificCalculatorTool(b, w) {
  w.t('Scientific Calculator');
  b.innerHTML=`<div style="padding:14px;overflow:auto;height:100%"><h2 style="margin-top:0">Scientific Calculator</h2>
    <input id="scInput" value="sqrt(81) + sin(PI / 2)" style="width:100%;padding:10px;font:16px Consolas,monospace">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0">
      ${['7','8','9','/','4','5','6','*','1','2','3','-','0','.','(',')','+','PI','sqrt(','sin(','cos(','tan(','log(','abs('].map(v=>`<button class="bt" data-sci="${v}">${v}</button>`).join('')}
    </div><button class="bt" data-xaction="calculate">Calculate</button><button class="bt" data-xaction="clear">Clear</button>
    <h3 id="scResult">Result appears here</h3><p style="font-size:12px">Supported functions: sqrt, sin, cos, tan, log, abs, floor, ceil, round, PI, E. Expressions are parsed without eval.</p>
  </div>`;
  const input=b.querySelector('#scInput'),result=b.querySelector('#scResult');
  const calculate=()=>{
    const allowed={PI:Math.PI,E:Math.E,sqrt:Math.sqrt,sin:Math.sin,cos:Math.cos,tan:Math.tan,log:Math.log,abs:Math.abs,floor:Math.floor,ceil:Math.ceil,round:Math.round};
    const expr=input.value.trim();
    if(!expr||!/^[0-9+\-*/().,%\sA-Za-z]+$/.test(expr)){result.textContent='Unsupported characters in expression.';return;}
    const tokens=expr.match(/[A-Za-z]+|(?:\d*\.)?\d+|[()+\-*/%,]/g)||[];
    if(tokens.join('')!==expr.replace(/\s/g,'')){result.textContent='Could not parse expression.';return;}
    let pos=0;
    const peek=()=>tokens[pos],take=()=>tokens[pos++];
    const primary=()=>{
      const t=take();
      if(t==='('){const v=add();if(take()!==')')throw Error('Missing closing parenthesis');return v;}
      if(t==='-')return -primary();if(t==='+')return primary();
      if(/^\d/.test(t||''))return Number(t);
      if(t in allowed){if(typeof allowed[t]==='number')return allowed[t];if(take()!=='(')throw Error('Function requires parentheses');const v=add();if(take()!==')')throw Error('Missing function parenthesis');return allowed[t](v);}
      throw Error('Unexpected token: '+t);
    };
    const mul=()=>{let v=primary();while(['*','/','%'].includes(peek())){const op=take(),n=primary();v=op==='*'?v*n:op==='/'?v/n:v%n;}return v;};
    const add=()=>{let v=mul();while(['+','-'].includes(peek())){const op=take(),n=mul();v=op==='+'?v+n:v-n;}return v;};
    try{const value=add();if(pos!==tokens.length)throw Error('Unexpected token: '+peek());result.textContent=Number.isFinite(value)?'Result: '+value:'Result is not finite.';}catch(error){result.textContent='Error: '+error.message;}
  };
  b.querySelectorAll('[data-sci]').forEach(button=>button.onclick=()=>{input.value+=button.dataset.sci;input.focus();});
  XTOOLS.bindButtons(b,action=>{if(action==='calculate')calculate();if(action==='clear'){input.value='';result.textContent='Cleared.';}});
  input.addEventListener('keydown',e=>{if(e.key==='Enter')calculate();});
}
